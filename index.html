<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Cineclub Prime</title>
<link href="https://fonts.googleapis.com/css2?family=Glass+Antiqua&family=Atkinson+Hyperlegible+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:          #34252F;
  --bg2:         #2a1c25;
  --bg3:         #231620;
  --gold:        #CDA93C;
  --gold-dim:    rgba(205,169,60,0.12);
  --gold-border: rgba(205,169,60,0.32);
  --text-soft:   rgba(205,169,60,0.65);
  --text-muted:  rgba(205,169,60,0.38);
  --font-d:      'Glass Antiqua', serif;
  --font-m:      'Atkinson Hyperlegible Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--gold);font-family:var(--font-m);font-size:14px;-webkit-font-smoothing:antialiased;}

/* SPLASH */
#splash{
  position:fixed;inset:0;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;cursor:pointer;transition:opacity 0.7s ease;padding:40px 32px;
}
#splash.out{opacity:0;pointer-events:none;}
.sp-logo{width:min(280px,80vw);margin-bottom:32px; fill: var(--gold);}
.sp-tag{font-size:0.58rem;letter-spacing:0.35em;color:var(--text-muted);text-transform:uppercase;text-align:center;margin-bottom:44px;line-height:1.9;}
.sp-cta{font-size:0.58rem;letter-spacing:0.28em;color:var(--gold);text-transform:uppercase;border:1px solid rgba(205,169,60,0.32);padding:11px 32px;animation:breathe 2.2s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:0.35}}

/* APP SHELL */
#app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;position:relative;overflow:hidden;}
.hdr{flex-shrink:0;background:var(--bg);border-bottom:1px solid rgba(205,169,60,0.32);display:flex;align-items:center;justify-content:center;padding:15px; font-family: var(--font-d); letter-spacing: 2px;}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 15px 100px;-webkit-overflow-scrolling:touch;}
.scroll::-webkit-scrollbar{display:none;}
.panel{display:none;}
.panel.on{display:block;}

/* BOTTOM NAV */
.bnav{position:absolute;bottom:0;left:0;right:0;background:var(--bg3);border-top:1px solid rgba(205,169,60,0.32);display:flex;padding-bottom:env(safe-area-inset-bottom,0);z-index:10;}
.nb{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:9px 4px 8px;gap:4px;}
.nb svg{width:22px;height:22px;stroke:var(--text-muted);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.nb span{font-family:var(--font-m);font-size:0.48rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);}
.nb.on svg{stroke:var(--gold);}
.nb.on span{color:var(--gold);}

/* TYPOGRAPHY & CARDS */
.t-title{font-family:var(--font-d);font-size:1.1rem;color:var(--gold);text-align:center;letter-spacing:0.06em;margin-bottom:2px;}
.t-sub{font-size:0.58rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);text-align:center;margin-bottom:14px;}
.card{background:var(--bg2);border-left:2px solid var(--gold);padding:14px; margin-bottom: 15px;}
.t-lbl{font-size:0.52rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--text-muted); margin-bottom: 8px; display: block;}
.gap{margin-bottom:8px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

/* FORMS */
input,select{background:var(--bg3);border:1px solid rgba(205,169,60,0.32);color:var(--gold);font-family:var(--font-m);font-size:0.82rem;padding:10px 12px;outline:none;width:100%; border-radius:0;}
.btn{background:var(--gold);color:#1a0c14;border:none;font-family:var(--font-m);font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;padding:12px 20px;cursor:pointer;font-weight:700;width:100%; margin-top: 10px;}
.btn-sm{width:auto;padding:10px 14px; margin-top: 0;}
.btn-x{background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;}

/* LIST ITEMS */
.ritem{background:var(--bg2);padding:12px 13px;border-left:2px solid transparent;margin-bottom:1px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
.ritem.sel{border-left-color:var(--gold);background:var(--bg3);}
.r-cat{font-family:var(--font-d);font-size:0.95rem;color:var(--gold);}
.r-meta{font-size:0.6rem;color:var(--text-muted);}
.cand-box{background:var(--bg3); padding: 15px; border: 1px solid var(--gold-border); margin-bottom: 20px;}
.cand-row{display:flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--gold-dim);}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--gold-border); border: 1px solid var(--gold-border); margin-top: 10px;}
.cal-day{background:var(--bg);min-height:40px;padding:4px; font-size: 0.7rem; position: relative;}
.cal-day.today{color: var(--gold); font-weight: bold;}
.cal-bar{width: 100%; height: 2px; background: var(--gold); margin-top: 2px;}

/* WHEEL & POOL */
.wheel{width:160px;height:160px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:20px auto; text-align: center; padding: 10px;}
.pool-row{font-size: 0.8rem; padding: 5px 0; border-bottom: 1px solid var(--gold-dim); display: flex; justify-content: space-between;}
</style>
</head>
<body>

<div id="splash" onclick="enterApp()">
  <div class="t-title" style="font-size: 2rem;">CINECLUB PRIME</div>
  <p class="sp-tag">Sala de proyección privada<br>Buenos Aires · 2026</p>
  <div class="sp-cta">Ingresar</div>
</div>

<div id="app">
  <div class="hdr">CINECLUB PRIME</div>

  <div class="scroll" id="scroll">
    <div class="panel on" id="p-reuniones">
      <div class="t-title">Reuniones</div>
      <div class="t-sub">Encuentros y categorías</div>
      
      <div class="card">
        <span class="t-lbl">Nueva reunión</span>
        <input type="text" id="nr-cat" placeholder="Categoría..." class="gap"/>
        <div class="grid2">
          <input type="date" id="nr-date"/>
          <input type="time" id="nr-time" value="20:00"/>
        </div>
        <button class="btn" onclick="addReunion()">+ Crear reunión</button>
      </div>

      <div id="reunion-list"></div>
      <div id="cand-panel" style="margin-top: 20px;"></div>

      <div class="t-lbl" style="margin-top:20px">Calendario</div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>

    <div class="panel" id="p-sorteo">
      <div class="t-title">Sorteo</div>
      <div class="t-sub">¿Qué vemos hoy?</div>
      <div id="s-pills" style="display:flex; gap:5px; flex-wrap:wrap; justify-content:center"></div>
      <div class="wheel" id="wtxt">Seleccioná una reunión</div>
      <button class="btn" onclick="sortear()">◆ Sortear ◆</button>
      <div id="pool-box" style="margin-top:20px"></div>
    </div>

    <div class="panel" id="p-miembros">
      <div class="t-title">Miembros</div>
      <div class="t-sub">El club</div>
      <div class="card">
        <input type="text" id="m-name" placeholder="Nombre..." class="gap"/>
        <input type="text" id="m-lb" placeholder="Usuario Letterboxd..."/>
        <button class="btn" onclick="addMember()">+ Agregar miembro</button>
      </div>
      <div id="m-grid"></div>
    </div>
  </div>

  <nav class="bnav">
    <button class="nb on" id="bn-reuniones" onclick="goTab('reuniones')">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>Reuniones</span>
    </button>
    <button class="nb" id="bn-sorteo" onclick="goTab('sorteo')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg>
      <span>Sorteo</span>
    </button>
    <button class="nb" id="bn-miembros" onclick="goTab('miembros')">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Miembros</span>
    </button>
  </nav>
</div>

<script>
/* ── CONFIGURACIÓN (REEMPLAZÁ ESTO) ── */
const AIRTABLE_TOKEN = "patEBhUFhtYaK7Yt1.c9a68a570fca71764b1725051aa50eec82d7685c02c64ccedf93212b0c6a94a8"; 
const BASE_ID = "app7dzqR9nVlqFnqa/tblKNXXeKMIDDrCZN/viwt6imKbggznE607?blocks=hide";

/* ── NÚCLEO DE CONEXIÓN DIRECTA ── */
async function at(tabla, metodo = 'GET', id = null, cuerpo = null) {
  const url = `https://api.airtable.com/v0/${BASE_ID}/${tabla}${id ? '/' + id : ''}`;
  const options = {
    method: metodo,
    headers: {
      'Authorization': `Bearer ${AIRTABLE_TOKEN}`,
      'Content-Type': 'application/json'
    }
  };
  if (cuerpo) options.body = JSON.stringify(cuerpo);
  
  const res = await fetch(url, options);
  if (!res.ok) throw new Error('Error Airtable');
  return res.json();
}

/* ── VARIABLES DE ESTADO ── */
let reuniones = [], members = [], activeR = null, sorteoR = null;

/* ── CARGA ── */
async function cargarTodo() {
  try {
    const [rData, mData] = await Promise.all([at('Reuniones'), at('Miembros')]);
    reuniones = (rData.records || []).map(r => ({ id: r.id, ...r.fields, candidatas: JSON.parse(r.fields.candidatas || '[]') }));
    members = (mData.records || []).map(r => ({ id: r.id, ...r.fields }));
    renderReuniones(); renderMembers(); renderCal();
  } catch (e) { console.error(e); }
}

/* ── LOGICA APP ── */
function enterApp() { document.getElementById('splash').classList.add('out'); }
function goTab(tab) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('on'));
  document.getElementById('p-' + tab).classList.add('on');
  document.getElementById('bn-' + tab).classList.add('on');
  if(tab === 'sorteo') renderSorteo();
}

// Reuniones
async function addReunion() {
  const cat = document.getElementById('nr-cat').value;
  const date = document.getElementById('nr-date').value;
  const time = document.getElementById('nr-time').value;
  if(!cat) return;
  await at('Reuniones', 'POST', null, { fields: { cat, date, time, candidatas: '[]' } });
  cargarTodo();
}

async function addCand(rid) {
  const title = document.getElementById('ct-' + rid).value;
  const proposer = document.getElementById('cp-' + rid).value;
  if(!title) return;
  const r = reuniones.find(x => x.id === rid);
  const nuevas = [...r.candidatas, { title, proposer }];
  await at('Reuniones', 'PATCH', rid, { fields: { candidatas: JSON.stringify(nuevas) } });
  cargarTodo();
}

function renderReuniones() {
  const list = document.getElementById('reunion-list');
  list.innerHTML = reuniones.map(r => `
    <div class="ritem ${activeR === r.id ? 'sel' : ''}" onclick="activeR='${r.id}';renderReuniones()">
      <div><div class="r-cat">${r.cat}</div><div class="r-meta">${r.date || 'Sin fecha'}</div></div>
      <span class="r-meta">${r.candidatas.length} pelis</span>
    </div>
  `).join('');

  const panel = document.getElementById('cand-panel');
  if(!activeR) { panel.innerHTML = '<div class="t-sub">Seleccioná una reunión</div>'; return; }
  const r = reuniones.find(x => x.id === activeR);
  const mOpts = members.map(m => `<option value="${m.name}">${m.name}</option>`).join('');
  panel.innerHTML = `
    <div class="cand-box">
      <span class="t-lbl">Propuestas para ${r.cat}</span>
      <div class="grid2 gap">
        <input type="text" id="ct-${r.id}" placeholder="Película..."/>
        <select id="cp-${r.id}"><option value="">¿Quién?</option>${mOpts}</select>
      </div>
      <button class="btn btn-sm" onclick="addCand('${r.id}')">Añadir</button>
      <div style="margin-top:15px">
        ${r.candidatas.map(c => `<div class="cand-row"><span>${c.title}</span><small>${c.proposer}</small></div>`).join('')}
      </div>
    </div>
  `;
}

// Sorteo
function renderSorteo() {
  const pills = document.getElementById('s-pills');
  pills.innerHTML = reuniones.map(r => `<button class="btn btn-sm" style="margin:2px" onclick="sorteoR='${r.id}';renderPool()">${r.cat}</button>`).join('');
}
function renderPool() {
  const r = reuniones.find(x => x.id === sorteoR);
  document.getElementById('pool-box').innerHTML = r.candidatas.map(c => `<div class="pool-row"><span>${c.title}</span><small>${c.proposer}</small></div>`).join('');
  document.getElementById('wtxt').textContent = "¡Listo!";
}
function sortear() {
  const r = reuniones.find(x => x.id === sorteoR);
  if(!r || !r.candidatas.length) return;
  const win = r.candidatas[Math.floor(Math.random() * r.candidatas.length)];
  document.getElementById('wtxt').innerHTML = `<small>Hoy vemos:</small><br><strong>${win.title}</strong>`;
}

// Miembros
async function addMember() {
  const name = document.getElementById('m-name').value;
  const lb = document.getElementById('m-lb').value;
  if(!name) return;
  await at('Miembros', 'POST', null, { fields: { name, lb } });
  cargarTodo();
}
function renderMembers() {
  document.getElementById('m-grid').innerHTML = members.map(m => `
    <div class="ritem"><span>${m.name}</span><small>@${m.lb}</small></div>
  `).join('');
}

// Calendario Simple
function renderCal() {
  const grid = document.getElementById('cal-grid');
  let h = '';
  for(let i=1; i<=31; i++) {
    const dStr = `2026-04-${String(i).padStart(2,'0')}`;
    const tiene = reuniones.some(r => r.date === dStr);
    h += `<div class="cal-day">${i}${tiene ? '<div class="cal-bar"></div>' : ''}</div>`;
  }
  grid.innerHTML = h;
}

cargarTodo();
</script>
</body>
</html>
